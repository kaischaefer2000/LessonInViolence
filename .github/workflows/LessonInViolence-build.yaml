# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  # Next.js static export (npm run build) writes the website into ./out
  DEPLOYMENT_FOLDER: ./out

jobs:
# Please do not rename this job
  build-project:
    name: build LessonInViolence
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # optimized images are only re-created when a picture changes
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            public/nextImageExportOptimizer
            images/next-image-export-optimizer-hashes.json
          key: optimized-images-${{ hashFiles('images/**', 'next.config.mjs') }}
          restore-keys: |
            optimized-images-

      # separate cache, so it is refreshed whenever the code changes (not only the pictures)
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'data/**', 'next.config.mjs') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 962f64a6-8986-41d3-a6bc-af02b9a21c76
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/LessonInViolence/config.yaml
          action: upload
